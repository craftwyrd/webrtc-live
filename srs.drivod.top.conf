# Public WHEP/WHIP entrypoint on the Aliyun host.
# The Aliyun host reaches home-server over the existing Tailscale network.

server {
    listen 80;
    listen [::]:80;
    server_name srs.drivod.top;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name srs.drivod.top;

    # Use a certificate whose SAN includes srs.drivod.top.
    ssl_certificate /etc/letsencrypt/live/srs.drivod.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srs.drivod.top/privkey.pem;

    client_max_body_size 4m;

    # Normalize the static player directory at the public edge so the home
    # Nginx never redirects users to its internal hostname and port.
    location = /rtc/whep {
        return 308 https://$host/rtc/whep/;
    }

    location / {
        proxy_pass http://100.64.0.101:20080;
        proxy_http_version 1.1;

        proxy_set_header Host srs.drivod.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WHEP carries only SDP over HTTP; do not buffer the negotiation.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;

        # Keep any upstream redirects on the public HTTPS origin.
        proxy_redirect http://srs.drivod.top:20080/ https://srs.drivod.top/;
        proxy_redirect http://ipv6.drivod.top:20080/ https://srs.drivod.top/;
        proxy_redirect http://home-server:20080/ https://srs.drivod.top/;
        proxy_redirect http://home-server.tail9bcce1.ts.net:20080/ https://srs.drivod.top/;
    }
}
