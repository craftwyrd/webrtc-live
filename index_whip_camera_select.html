<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多摄像头推流控制</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .video-box {
            flex: 1;
            min-width: 400px;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            background: #000;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        button {
            padding: 10px 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:disabled {
            background: #cccccc;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        h3 {
            margin-top: 0;
        }
        .settings-group {
            margin: 15px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .settings-group h4 {
            margin-top: 0;
            margin-bottom: 10px;
        }
        .settings-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .settings-row label {
            width: 120px;
            margin-right: 10px;
        }
        .settings-row input, .settings-row select {
            flex: 1;
            padding: 5px;
        }
        #cameraContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .camera-control {
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 5px;
            background: #f9f9f9;
        }
        .add-camera-btn {
            background: #28a745;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>多摄像头推流控制</h1>
    
    <button id="addCameraBtn" class="add-camera-btn">+ 添加摄像头推流</button>
    
    <div id="cameraContainer">
        <!-- 摄像头推流控制将在这里动态添加 -->
    </div>
    
    <script>
        // 推流地址基础URL
        const WHIP_ENDPOINT_BASE = 'https://drivod.top/rtc/v1/whip/?app=live&stream=';
        
        // 全局变量
        let cameraCount = 0;
        let audioContext;
        let cameraDevices = [];
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', async () => {
            // 获取摄像头设备列表
            await refreshCameraList();
            
            // 添加第一个摄像头推流
            addCameraStreamer();
            
            // 添加摄像头按钮事件
            document.getElementById('addCameraBtn').addEventListener('click', addCameraStreamer);
        });
        
        // 刷新摄像头设备列表
        async function refreshCameraList() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                cameraDevices = devices.filter(device => device.kind === 'videoinput');
                console.log('可用的摄像头设备:', cameraDevices);
            } catch (error) {
                console.error('获取设备列表失败:', error);
            }
        }
        
        // 添加一个新的摄像头推流控制
        function addCameraStreamer() {
            cameraCount++;
            const streamId = `camera${cameraCount}`;
            const endpoint = `${WHIP_ENDPOINT_BASE}${streamId}`;
            
            // 创建摄像头控制元素
            const cameraControl = document.createElement('div');
            cameraControl.className = 'video-box camera-control';
            cameraControl.id = `cameraControl${cameraCount}`;
            cameraControl.innerHTML = `
                <h3>摄像头 ${cameraCount} (推送到 ${streamId})</h3>
                
                <div class="settings-group">
                    <h4>设备选择</h4>
                    <div class="settings-row">
                        <label for="cameraDevice${cameraCount}">摄像头:</label>
                        <select id="cameraDevice${cameraCount}">
                            ${cameraDevices.map((device, i) => 
                                `<option value="${device.deviceId}">${device.label || `摄像头 ${i+1}`}</option>`
                            ).join('')}
                        </select>
                    </div>
                </div>
                
                <div class="settings-group">
                    <h4>视频设置</h4>
                    <div class="settings-row">
                        <label for="cameraWidth${cameraCount}">宽度:</label>
                        <input type="number" id="cameraWidth${cameraCount}" value="1920" min="320" max="3840">
                    </div>
                    <div class="settings-row">
                        <label for="cameraHeight${cameraCount}">高度:</label>
                        <input type="number" id="cameraHeight${cameraCount}" value="1080" min="240" max="2160">
                    </div>
                    <div class="settings-row">
                        <label for="cameraFps${cameraCount}">帧率:</label>
                        <input type="number" id="cameraFps${cameraCount}" value="60" min="1" max="120">
                    </div>
                    <div class="settings-row">
                        <label for="cameraBitrate${cameraCount}">码率(kbps):</label>
                        <input type="number" id="cameraBitrate${cameraCount}" value="5000" min="500" max="20000">
                    </div>
                </div>
                
                <video id="cameraVideo${cameraCount}" autoplay muted playsinline></video>
                <div id="cameraStatus${cameraCount}" class="status info">摄像头推流未开始</div>
                <div class="controls">
                    <button id="startCameraBtn${cameraCount}">开始推流</button>
                    <button id="stopCameraBtn${cameraCount}" disabled>停止推流</button>
                    <button id="removeCameraBtn${cameraCount}" class="remove-btn">移除</button>
                </div>
            `;
            
            document.getElementById('cameraContainer').appendChild(cameraControl);
            
            // 获取DOM元素
            const videoElement = document.getElementById(`cameraVideo${cameraCount}`);
            const startBtn = document.getElementById(`startCameraBtn${cameraCount}`);
            const stopBtn = document.getElementById(`stopCameraBtn${cameraCount}`);
            const removeBtn = document.getElementById(`removeCameraBtn${cameraCount}`);
            const statusElement = document.getElementById(`cameraStatus${cameraCount}`);
            
            // 摄像头流和PeerConnection
            let cameraStream;
            let peerConnection;
            
            // 开始推流
            async function startStreaming() {
                try {
                    const deviceId = document.getElementById(`cameraDevice${cameraCount}`).value;
                    const width = parseInt(document.getElementById(`cameraWidth${cameraCount}`).value);
                    const height = parseInt(document.getElementById(`cameraHeight${cameraCount}`).value);
                    const fps = parseInt(document.getElementById(`cameraFps${cameraCount}`).value);
                    const bitrate = parseInt(document.getElementById(`cameraBitrate${cameraCount}`).value);
                    
                    setStatus(statusElement, '正在获取摄像头权限...');
                    
                    // 获取摄像头流
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            deviceId: deviceId ? { exact: deviceId } : undefined,
                            width: { ideal: width },
                            height: { ideal: height },
                            frameRate: { ideal: fps }
                        },
                        audio: true
                    });
                    
                    // 确保有音频轨道
                    cameraStream = await ensureAudioTrack(cameraStream);
                    
                    videoElement.srcObject = cameraStream;
                    setStatus(statusElement, '正在建立推流连接...');
                    
                    // 创建并设置PeerConnection
                    peerConnection = await createAndSetupPeerConnection(
                        cameraStream, 
                        endpoint, 
                        statusElement,
                        bitrate
                    );
                    
                    // 设置ICE候选和连接状态回调
                    peerConnection.onicecandidate = (event) => {
                        if (event.candidate) {
                            console.log(`摄像头 ${cameraCount} ICE candidate:`, event.candidate);
                        }
                    };
                    
                    peerConnection.onconnectionstatechange = () => {
                        console.log(`摄像头 ${cameraCount} 连接状态:`, peerConnection.connectionState);
                        if (peerConnection.connectionState === 'connected') {
                            setStatus(statusElement, '推流已连接!', 'success');
                        } else if (peerConnection.connectionState === 'disconnected') {
                            setStatus(statusElement, '推流已断开', 'error');
                        }
                    };
                    
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    
                } catch (error) {
                    console.error(`摄像头 ${cameraCount} 推流错误:`, error);
                    setStatus(statusElement, `推流错误: ${error.message}`, 'error');
                    stopStreaming();
                }
            }
            
            // 停止推流
            function stopStreaming() {
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
                
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                    cameraStream = null;
                    videoElement.srcObject = null;
                }
                
                startBtn.disabled = false;
                stopBtn.disabled = true;
                
                setStatus(statusElement, '推流已停止');
            }
            
            // 移除摄像头控制
            function removeCamera() {
                stopStreaming();
                cameraControl.remove();
            }
            
            // 事件监听
            startBtn.addEventListener('click', startStreaming);
            stopBtn.addEventListener('click', stopStreaming);
            removeBtn.addEventListener('click', removeCamera);
        }
        
        // 设置状态信息
        function setStatus(element, message, type = 'info') {
            element.textContent = message;
            element.className = `status ${type}`;
        }

        // 创建空白音频轨道
        async function createSilentAudioTrack() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            gainNode.gain.value = 0; // 静音
            
            oscillator.connect(gainNode);
            
            const dest = audioContext.createMediaStreamDestination();
            gainNode.connect(dest);
            
            oscillator.start();
            
            return dest.stream.getAudioTracks()[0];
        }

        // 确保流中有音频轨道
        async function ensureAudioTrack(stream) {
            const audioTracks = stream.getAudioTracks();
            if (audioTracks.length === 0) {
                const silentAudioTrack = await createSilentAudioTrack();
                stream.addTrack(silentAudioTrack);
                console.log('添加了空白音轨');
            }
            return stream;
        }

        // 创建PeerConnection并处理SDP交换
        async function createAndSetupPeerConnection(stream, endpoint, statusElement, bitrate) {
            const pc = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' }
                ]
            });

            // 添加所有轨道到连接
            stream.getTracks().forEach(track => {
                pc.addTrack(track, stream);
            });

            // 创建offer并设置本地描述
            const offer = await pc.createOffer({
                offerToReceiveAudio: false,
                offerToReceiveVideo: false
            });
            
            await pc.setLocalDescription(offer);

            // 设置码率参数
            if (bitrate) {
                const senders = pc.getSenders();
                senders.forEach(sender => {
                    if (sender.track.kind === 'video') {
                        const parameters = sender.getParameters();
                        if (!parameters.encodings) {
                            parameters.encodings = [{}];
                        }
                        parameters.encodings[0].maxBitrate = bitrate * 1000; // 转换为bps
                        sender.setParameters(parameters).catch(console.error);
                    }
                });
            }

            // 发送offer到服务器
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/sdp' },
                body: offer.sdp
            });

            if (!response.ok) {
                throw new Error(`服务器返回错误: ${response.status}`);
            }

            // 获取answer并设置远程描述
            const answerSdp = await response.text();
            await pc.setRemoteDescription({
                type: 'answer',
                sdp: answerSdp
            });

            return pc;
        }
    </script>
</body>
</html>
