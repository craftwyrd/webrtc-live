<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双路推流 - 带音频的屏幕与摄像头</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .video-box {
            flex: 1;
            min-width: 400px;
        }
        video {
            width: 100%;
            background: #000;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        button {
            padding: 10px 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:disabled {
            background: #cccccc;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        h3 {
            margin-top: 0;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
        }
        .settings-group {
            margin: 15px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .settings-group h4 {
            margin-top: 0;
            margin-bottom: 10px;
        }
        .settings-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .settings-row label {
            width: 120px;
            margin-right: 10px;
        }
        .settings-row input, .settings-row select {
            flex: 1;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>WebRTC 双路推流（含屏幕音频）</h1>
    <p>将带音频的屏幕内容推送到 livestream，摄像头内容推送到 camera</p>
    
    <div class="container">
        <div class="video-box">
            <h3>屏幕内容 (推送到 livestream)</h3>
            
            <div class="settings-group">
                <h4>视频设置</h4>
                <div class="settings-row">
                    <label for="screenWidth">宽度:</label>
                    <input type="number" id="screenWidth" value="1920" min="640" max="3840">
                </div>
                <div class="settings-row">
                    <label for="screenHeight">高度:</label>
                    <input type="number" id="screenHeight" value="1080" min="480" max="2160">
                </div>
                <div class="settings-row">
                    <label for="screenFps">帧率:</label>
                    <input type="number" id="screenFps" value="60" min="1" max="120">
                </div>
                <div class="settings-row">
                    <label for="screenBitrate">码率(kbps):</label>
                    <input type="number" id="screenBitrate" value="5000" min="500" max="20000">
                </div>
            </div>
            
            <div class="checkbox-container">
                <input type="checkbox" id="captureSystemAudio" checked>
                <label for="captureSystemAudio">共享系统音频</label>
            </div>
            
            <video id="screenVideo" autoplay playsinline></video>
            <div id="screenStatus" class="status info">屏幕推流未开始</div>
            <div class="controls">
                <button id="startScreenBtn">开始屏幕推流</button>
                <button id="stopScreenBtn" disabled>停止屏幕推流</button>
            </div>
        </div>
        
        <div class="video-box">
            <h3>摄像头内容 (推送到 camera)</h3>
            
            <div class="settings-group">
                <h4>视频设置</h4>
                <div class="settings-row">
                    <label for="cameraWidth">宽度:</label>
                    <input type="number" id="cameraWidth" value="1920" min="320" max="3840">
                </div>
                <div class="settings-row">
                    <label for="cameraHeight">高度:</label>
                    <input type="number" id="cameraHeight" value="1080" min="240" max="2160">
                </div>
                <div class="settings-row">
                    <label for="cameraFps">帧率:</label>
                    <input type="number" id="cameraFps" value="60" min="1" max="120">
                </div>
                <div class="settings-row">
                    <label for="cameraBitrate">码率(kbps):</label>
                    <input type="number" id="cameraBitrate" value="5000" min="500" max="20000">
                </div>
            </div>
            
            <video id="cameraVideo" autoplay muted playsinline></video>
            <div id="cameraStatus" class="status info">摄像头推流未开始</div>
            <div class="controls">
                <button id="startCameraBtn">开始摄像头推流</button>
                <button id="stopCameraBtn" disabled>停止摄像头推流</button>
            </div>
        </div>
    </div>
    
    <script>
        // 推流地址
        const SCREEN_WHIP_ENDPOINT = 'https://47.108.181.53/rtc/v1/whip/?app=live&stream=livestream';
        const CAMERA_WHIP_ENDPOINT = 'https://47.108.181.53/rtc/v1/whip/?app=live&stream=camera';
        
        // 获取DOM元素
        const screenVideo = document.getElementById('screenVideo');
        const cameraVideo = document.getElementById('cameraVideo');
        const startScreenBtn = document.getElementById('startScreenBtn');
        const stopScreenBtn = document.getElementById('stopScreenBtn');
        const startCameraBtn = document.getElementById('startCameraBtn');
        const stopCameraBtn = document.getElementById('stopCameraBtn');
        const screenStatus = document.getElementById('screenStatus');
        const cameraStatus = document.getElementById('cameraStatus');
        const captureSystemAudioCheckbox = document.getElementById('captureSystemAudio');
        
        // 视频设置元素
        const screenWidthInput = document.getElementById('screenWidth');
        const screenHeightInput = document.getElementById('screenHeight');
        const screenFpsInput = document.getElementById('screenFps');
        const screenBitrateInput = document.getElementById('screenBitrate');
        const cameraWidthInput = document.getElementById('cameraWidth');
        const cameraHeightInput = document.getElementById('cameraHeight');
        const cameraFpsInput = document.getElementById('cameraFps');
        const cameraBitrateInput = document.getElementById('cameraBitrate');
        
        // 全局变量
        let screenStream;
        let cameraStream;
        let screenPeerConnection;
        let cameraPeerConnection;
        let audioContext;
        
        // 设置状态信息
        function setStatus(element, message, type = 'info') {
            element.textContent = message;
            element.className = `status ${type}`;
        }

        // 创建空白音频轨道
        async function createSilentAudioTrack() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            gainNode.gain.value = 0; // 静音
            
            oscillator.connect(gainNode);
            
            const dest = audioContext.createMediaStreamDestination();
            gainNode.connect(dest);
            
            oscillator.start();
            
            return dest.stream.getAudioTracks()[0];
        }

        // 确保流中有音频轨道
        async function ensureAudioTrack(stream) {
            const audioTracks = stream.getAudioTracks();
            if (audioTracks.length === 0) {
                const silentAudioTrack = await createSilentAudioTrack();
                stream.addTrack(silentAudioTrack);
                console.log('添加了空白音轨');
            }
            return stream;
        }

        // 创建PeerConnection并处理SDP交换
        async function createAndSetupPeerConnection(stream, endpoint, statusElement, bitrate) {
            const pc = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' }
                ]
            });

            // 添加所有轨道到连接
            stream.getTracks().forEach(track => {
                pc.addTrack(track, stream);
            });

            // 创建offer并设置本地描述
            const offer = await pc.createOffer({
                offerToReceiveAudio: false,
                offerToReceiveVideo: false
            });
            
            await pc.setLocalDescription(offer);

            // 设置码率参数
            if (bitrate) {
                const senders = pc.getSenders();
                senders.forEach(sender => {
                    if (sender.track.kind === 'video') {
                        const parameters = sender.getParameters();
                        if (!parameters.encodings) {
                            parameters.encodings = [{}];
                        }
                        parameters.encodings[0].maxBitrate = bitrate * 1000; // 转换为bps
                        sender.setParameters(parameters).catch(console.error);
                    }
                });
            }

            // 发送offer到服务器
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/sdp' },
                body: offer.sdp
            });

            if (!response.ok) {
                throw new Error(`服务器返回错误: ${response.status}`);
            }

            // 获取answer并设置远程描述
            const answerSdp = await response.text();
            await pc.setRemoteDescription({
                type: 'answer',
                sdp: answerSdp
            });

            return pc;
        }
        
        // 开始屏幕推流（包含音频）
        async function startScreenStreaming() {
            try {
                const captureSystemAudio = captureSystemAudioCheckbox.checked;
                const width = parseInt(screenWidthInput.value);
                const height = parseInt(screenHeightInput.value);
                const fps = parseInt(screenFpsInput.value);
                const bitrate = parseInt(screenBitrateInput.value);
                
                setStatus(screenStatus, '正在获取屏幕共享权限...');
                
                // 获取屏幕共享流
                const displayMediaOptions = {
                    video: {
                        width: { ideal: width },
                        height: { ideal: height },
                        frameRate: { ideal: fps }
                    },
                    audio: captureSystemAudio
                };
                
                // 显示自定义提示
                if (captureSystemAudio) {
                    if (!confirm('要捕获系统音频，请选择"整个屏幕"或"浏览器标签页"。\n\n如果选择"窗口"，将无法捕获音频。\n\n是否继续？')) {
                        setStatus(screenStatus, '用户取消了屏幕共享', 'info');
                        return;
                    }
                }
                
                screenStream = await navigator.mediaDevices.getDisplayMedia(displayMediaOptions);
                
                // 检查用户实际选择了什么
                const videoTrack = screenStream.getVideoTracks()[0];
                const settings = videoTrack.getSettings();
                
                // 如果用户选择了窗口但要求捕获系统音频，提示用户
                if (captureSystemAudio && settings.displaySurface === 'window') {
                    alert('您选择了窗口，无法捕获系统音频。\n\n要捕获系统音频，请选择"整个屏幕"或"浏览器标签页"。\n\n将使用静音音频轨道代替。');
                    screenStream = await ensureAudioTrack(screenStream);
                } else if (captureSystemAudio && screenStream.getAudioTracks().length === 0) {
                    // 用户选择了整个屏幕或标签页但没有音频，添加空白音轨
                    screenStream = await ensureAudioTrack(screenStream);
                } else if (!captureSystemAudio) {
                    // 用户不要求系统音频，确保有空白音轨
                    screenStream = await ensureAudioTrack(screenStream);
                }
                
                screenVideo.srcObject = screenStream;
                setStatus(screenStatus, '正在建立屏幕推流连接...');
                
                // 创建并设置PeerConnection
                screenPeerConnection = await createAndSetupPeerConnection(
                    screenStream, 
                    SCREEN_WHIP_ENDPOINT, 
                    screenStatus,
                    bitrate
                );
                
                // 设置ICE候选和连接状态回调
                screenPeerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        console.log('屏幕 ICE candidate:', event.candidate);
                    }
                };
                
                screenPeerConnection.onconnectionstatechange = () => {
                    console.log('屏幕连接状态:', screenPeerConnection.connectionState);
                    if (screenPeerConnection.connectionState === 'connected') {
                        setStatus(screenStatus, '屏幕推流已连接!', 'success');
                    } else if (screenPeerConnection.connectionState === 'disconnected') {
                        setStatus(screenStatus, '屏幕推流已断开', 'error');
                    }
                };
                
                // 监听屏幕共享停止事件
                screenStream.getVideoTracks()[0].onended = () => {
                    stopScreenStreaming();
                    setStatus(screenStatus, '用户停止了屏幕共享', 'error');
                };
                
                startScreenBtn.disabled = true;
                stopScreenBtn.disabled = false;
                
            } catch (error) {
                console.error('屏幕推流错误:', error);
                setStatus(screenStatus, `屏幕推流错误: ${error.message}`, 'error');
                stopScreenStreaming();
            }
        }
        
        // 停止屏幕推流
        function stopScreenStreaming() {
            if (screenPeerConnection) {
                screenPeerConnection.close();
                screenPeerConnection = null;
            }
            
            if (screenStream) {
                screenStream.getTracks().forEach(track => track.stop());
                screenStream = null;
                screenVideo.srcObject = null;
            }
            
            startScreenBtn.disabled = false;
            stopScreenBtn.disabled = true;
            
            setStatus(screenStatus, '屏幕推流已停止');
        }
        
        // 开始摄像头推流
        async function startCameraStreaming() {
            try {
                const width = parseInt(cameraWidthInput.value);
                const height = parseInt(cameraHeightInput.value);
                const fps = parseInt(cameraFpsInput.value);
                const bitrate = parseInt(cameraBitrateInput.value);
                
                setStatus(cameraStatus, '正在获取摄像头权限...');
                
                // 获取摄像头流
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: width },
                        height: { ideal: height },
                        frameRate: { ideal: fps }
                    },
                    audio: true
                });
                
                // 确保有音频轨道
                cameraStream = await ensureAudioTrack(cameraStream);
                
                cameraVideo.srcObject = cameraStream;
                setStatus(cameraStatus, '正在建立摄像头推流连接...');
                
                // 创建并设置PeerConnection
                cameraPeerConnection = await createAndSetupPeerConnection(
                    cameraStream, 
                    CAMERA_WHIP_ENDPOINT, 
                    cameraStatus,
                    bitrate
                );
                
                // 设置ICE候选和连接状态回调
                cameraPeerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        console.log('摄像头 ICE candidate:', event.candidate);
                    }
                };
                
                cameraPeerConnection.onconnectionstatechange = () => {
                    console.log('摄像头连接状态:', cameraPeerConnection.connectionState);
                    if (cameraPeerConnection.connectionState === 'connected') {
                        setStatus(cameraStatus, '摄像头推流已连接!', 'success');
                    } else if (cameraPeerConnection.connectionState === 'disconnected') {
                        setStatus(cameraStatus, '摄像头推流已断开', 'error');
                    }
                };
                
                startCameraBtn.disabled = true;
                stopCameraBtn.disabled = false;
                
            } catch (error) {
                console.error('摄像头推流错误:', error);
                setStatus(cameraStatus, `摄像头推流错误: ${error.message}`, 'error');
                stopCameraStreaming();
            }
        }
        
        // 停止摄像头推流
        function stopCameraStreaming() {
            if (cameraPeerConnection) {
                cameraPeerConnection.close();
                cameraPeerConnection = null;
            }
            
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
                cameraVideo.srcObject = null;
            }
            
            startCameraBtn.disabled = false;
            stopCameraBtn.disabled = true;
            
            setStatus(cameraStatus, '摄像头推流已停止');
        }
        
        // 事件监听
        startScreenBtn.addEventListener('click', startScreenStreaming);
        stopScreenBtn.addEventListener('click', stopScreenStreaming);
        startCameraBtn.addEventListener('click', startCameraStreaming);
        stopCameraBtn.addEventListener('click', stopCameraStreaming);
    </script>
</body>
</html>
