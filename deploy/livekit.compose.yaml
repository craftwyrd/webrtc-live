name: webrtc-live-voice

services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: webrtc-live-livekit
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    depends_on:
      - redis
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: webrtc-live-livekit-redis
    restart: unless-stopped
    network_mode: host
    command: redis-server --appendonly yes --bind 127.0.0.1 ::1 --protected-mode yes
    volumes:
      - livekit-redis-data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  livekit-redis-data:
    name: webrtc-live-livekit-redis-data
