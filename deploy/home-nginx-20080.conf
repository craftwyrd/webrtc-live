server {
    listen 20080 default_server;
    listen [::]:20080 default_server;
    server_name _;

    # NATMap runs on the LAN router and may only update this internal endpoint.
    location = /internal/natmap {
        allow 192.168.100.1;
        deny all;

        proxy_pass http://127.0.0.1:21080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # The public Aliyun proxy reaches this listener over Tailscale.
    location / {
        allow 100.64.0.0/10;
        deny all;

        proxy_pass http://127.0.0.1:21080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
