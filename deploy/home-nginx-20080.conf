server {
    listen 20080 default_server;
    listen [::]:20080 default_server;
    server_name _;

    # NATMap runs on the LAN router and may only update this internal endpoint.
    location = /internal/natmap {
        client_max_body_size 4k;

        allow 192.168.100.1;
        allow 127.0.0.1;
        allow ::1;
        deny all;

        limit_except POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:21080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # WebSocket presence/chat endpoint. Upgrade must be forwarded again at
    # this second proxy hop before the request reaches Node.js.
    location = /ws/presence {
        allow 100.64.0.0/10;
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:21080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # SRS WHIP/WHEP HTTP signaling. Keep this narrower than /rtc/ because
    # /rtc/natmap.json and the /rtc/whip + /rtc/whep pages belong to Node.js.
    location ^~ /rtc/v1/ {
        allow 100.64.0.0/10;
        allow 127.0.0.1;
        allow ::1;
        deny all;

        # No URI suffix: preserve /rtc/v1/... exactly for SRS on port 1985.
        proxy_pass http://127.0.0.1:1985;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # The public Aliyun proxy reaches this listener over Tailscale.
    location / {
        allow 100.64.0.0/10;
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:21080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
