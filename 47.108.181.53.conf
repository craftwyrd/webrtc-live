server {
    listen 443 ssl;
    server_name drivod.top drivod.top;
    ssl_certificate /etc/nginx/ssl/drivod.top.pem;
    ssl_certificate_key /etc/nginx/ssl/drivod.top.key;

    # websocker配置
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location /rtc/whip {
        alias /etc/nginx/html/webrtc/;
        index index_whip_camera.html;
        try_files $uri $uri/ /index_whip_camera.html;
        disable_symlinks off;
        proxy_cache off; # 禁用代理缓存
    }

    # WebRTC静态页面服务
    location /rtc/whep {
        alias /etc/nginx/html/webrtc/;
        index index_whep.html;
        try_files $uri $uri/ /index_whep.html;
        disable_symlinks off;
    }

    # SRS HTTP API代理
    location /rtc/ {
        proxy_pass http://127.0.0.1:1985/rtc/;

        # 低延迟关键参数
        proxy_cache off; # 禁用代理缓存
    }

    # 其他静态资源
    location /xiaolu {
        alias /etc/nginx/html/xiaolu/;
        index index.html;
        try_files $uri $uri/ /xiaolu/index.html;
    }
    
    # SRS控制台（可选）
    location /srs {
        proxy_pass http://127.0.0.1:8080/;
    }

    # minio
    # MinIO 控制台代理
    # MinIO 控制台
    location /minio/ {
        proxy_pass http://127.0.0.1:9001/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        sub_filter '="/' '="/minio/';
        #sub_filter_types text/html;

        client_max_body_size 10G; # 例如设置为10GB
        # 以下是为大文件上传优化的设置
        proxy_request_buffering off;
        proxy_buffering off;
    }

}

server {
    listen 80;
    server_name drivod.top drivod.top;

    # 禁用HTTPS重定向（重要！）
    return 301 https://$server_name$request_uri;

    # 禁用缓存
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
