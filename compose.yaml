
services:
  webrtc-live:
    image: registry.cn-chengdu.aliyuncs.com/craftwyrd/webrtc-live:latest
    container_name: webrtc-live
    restart: unless-stopped
    network_mode: host
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - ./webrtc-live:/var/lib/webrtc-live
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 15s
